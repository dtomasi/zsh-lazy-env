name: Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activate hermit
        uses: cashapp/activate-hermit@v1

      - name: Verify installations
        run: |
          zsh --version
          shellcheck --version

      - name: Run test suite
        run: |
          chmod +x tests/run-tests.zsh
          export CI=true
          ./tests/run-tests.zsh --ci

      - name: Run shellcheck
        run: |
          echo "Running shellcheck on plugin..."
          shellcheck lazy-env.plugin.zsh
          echo "Running shellcheck on tests..."
          for file in tests/*.zsh; do
            echo "Checking $file..."
            timeout 30s shellcheck "$file" || echo "Warning: shellcheck failed or timed out for $file"
          done
          echo "Shellcheck completed"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/
          retention-days: 7

  compatibility:
    name: Cross-platform compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activate hermit
        uses: cashapp/activate-hermit@v1

      - name: Verify zsh
        run: zsh --version

      - name: Run core tests
        run: |
          chmod +x tests/run-tests.zsh
          export CI=true
          ./tests/run-tests.zsh --ci --skip-integration
