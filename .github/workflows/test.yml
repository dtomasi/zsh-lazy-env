name: Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Activate hermit
        uses: cashapp/activate-hermit@v1

      - name: Install zsh (fallback)
        run: |
          # Install zsh if not available via hermit
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi

      - name: Verify installations
        run: |
          echo "=== Verifying installations ==="
          which zsh && zsh --version
          which shellcheck && shellcheck --version
          echo "=== Environment ==="
          echo "PWD: $PWD"
          echo "USER: $USER"
          echo "HOME: $HOME"
          echo "CI: $CI"
          ls -la tests/

      - name: Run test suite
        run: |
          chmod +x tests/run-tests.zsh
          export CI=true
          export TERM=xterm
          # Run tests with explicit shell
          zsh ./tests/run-tests.zsh --ci
        timeout-minutes: 5

      - name: Run shellcheck
        run: |
          echo "Running shellcheck on plugin..."
          shellcheck lazy-env.plugin.zsh
          echo "Running shellcheck on tests..."
          for file in tests/*.zsh; do
            echo "Checking $file..."
            timeout 30s shellcheck "$file" || echo "Warning: shellcheck failed or timed out for $file"
          done
          echo "Shellcheck completed"
        timeout-minutes: 2

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: |
            tests/
            *.log
          retention-days: 7

  compatibility:
    name: Cross-platform compatibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Activate hermit
        uses: cashapp/activate-hermit@v1

      - name: Install zsh (Ubuntu fallback)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi

      - name: Verify zsh
        run: |
          which zsh
          zsh --version

      - name: Run core tests
        run: |
          chmod +x tests/run-tests.zsh
          export CI=true
          export TERM=xterm
          zsh ./tests/run-tests.zsh --ci --skip-integration
        timeout-minutes: 5
